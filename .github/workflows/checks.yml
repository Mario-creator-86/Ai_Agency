name: Foundation checks
# Run explicitly; initial publication must not activate hosted jobs.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The project supports >=3.12,<3.15; the Owner's studio runs 3.14.
        python-version: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      # A film test that would skip for a missing FFmpeg, its subtitles filter or the YuNet
      # model fails here instead (tests/suite_switches.py): CI must not stay green while the
      # film pipeline goes untested.
      STUDIO_REQUIRE_FFMPEG: '1'
      PYTHONUTF8: '1'
      # Hosted runners have about 14 GB free; the studio's disk guard (default 20 GB) would
      # otherwise answer LOW_DISK to every paid step on fakes and 503 to /health/ready.
      STUDIO_MIN_FREE_GB: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install FFmpeg (with libass) on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: FFmpeg is on PATH
        shell: bash
        run: ffmpeg -hide_banner -version | head -1 && ffprobe -hide_banner -version | head -1
      - run: uv sync --locked
      - run: npm ci --prefix frontend
      - run: uv run python scripts/check_docs.py
      - run: uv run python scripts/check_secrets.py
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: npm run check --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - run: uv run pytest
  e2e:
    # The page's own flows in a headless Chromium against the backend on fakes
    # (scripts/e2e_server.py: TEST, 127.0.0.1, a free port, a throwaway database, every paid
    # vendor replaced, no socket beyond the machine; the page built into a temporary folder).
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --locked
      - run: npm ci --prefix frontend
      - name: Install Chromium for Playwright
        run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm run test:e2e --prefix frontend
  audit:
    # Known vulnerabilities in every locked dependency, dev tools included.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - name: Export the lock as requirements
        run: uv export --frozen --all-groups --no-hashes --no-emit-project -o requirements-audit.txt
      - name: pip-audit
        # Every version is pinned by the lock, so nothing is resolved or installed.
        run: uvx pip-audit --strict --disable-pip --no-deps -r requirements-audit.txt
