[project]
name = "amn-ai"
version = "0.1.0"
description = "AMN-AI (Autonomous Machine Nexus) — local-first, backend-authoritative AI media studio"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  # Required for the /api/v1/ws gateway: without a WebSocket library uvicorn answers the
  # handshake with 404 and the 2D office silently loses its real-time event feed.
  "websockets>=13,<16",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3",
  "tzdata>=2025.1",
  "cryptography>=46,<49",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2", "detect-secrets>=1.5,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
files = ["backend/app"]
check_untyped_defs = true
disallow_untyped_defs = true

