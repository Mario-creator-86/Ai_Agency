<!doctype html><html><head><meta charset="utf-8"><title>AMN local stream stability audit</title>
<style>body{margin:12px;background:#080e1c;color:#fff;font:14px system-ui}#viewport{position:relative;width:min(960px,95vw);aspect-ratio:1600/840}.live-stream-layer{position:absolute;inset:0;background:#060a14}.live-stream-layer video,.live-stream-still{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.paused video{visibility:hidden}.live-stream-still{z-index:1}.live-stream-badge{position:absolute;bottom:12px;right:12px;z-index:2}pre{white-space:pre-wrap}</style></head>
<body><h1>Local stream stability audit</h1><p>This page tests the real LiveStream component against local signalling; it does not send studio actions.</p><button id="recovery">Test one viewer disconnect and recovery</button><div id="viewport"></div><pre id="metrics">Connecting…</pre>
<script type="module">
import { LiveStream } from '../../src/hq_stream.js';
const started = performance.now();
const history = [];
const viewport = document.querySelector('#viewport');
const stream = new LiveStream(viewport, {signallingUrl:'ws://127.0.0.1:8890',streamerId:'DefaultStreamer',retryMs:15000}, {
  onStatus(status){history.push({seconds:Math.round((performance.now()-started)/1000),status});}
});
stream.start();
document.querySelector('#recovery').addEventListener('click',()=>{
  stream.stream.disconnect();
  setTimeout(()=>stream.stream.connect(),2000);
});
setInterval(()=>{
  const video=viewport.querySelector('video');
  const quality=video?.getVideoPlaybackQuality();
  document.querySelector('#metrics').textContent=JSON.stringify({elapsed:Math.round((performance.now()-started)/1000),status:stream.status,video:video?{readyState:video.readyState,time:video.currentTime,width:video.videoWidth,height:video.videoHeight,frames:quality?.totalVideoFrames,dropped:quality?.droppedVideoFrames}:null,history},null,2);
},1000);
</script></body></html>
