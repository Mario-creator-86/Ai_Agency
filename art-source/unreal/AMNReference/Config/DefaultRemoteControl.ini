; The live headquarters: the backend sets the scene's people from studio state through Remote
; Control's HTTP API, which listens on this machine only. The WebSocket server is not used: it
; stays off, and bound to this machine should anything start it. (URemoteControlSettings reads
; this file, config=RemoteControl, not DefaultEngine.ini.)
[/Script/RemoteControlCommon.RemoteControlSettings]
RemoteControlHttpServerPort=30010
bAutoStartWebSocketServer=False
RemoteControlWebsocketServerBindAddress=127.0.0.1
RemoteControlWebInterfaceBindAddress=127.0.0.1
; Only the calls the backend's bridge makes (backend/app/office/unreal.py): show or hide an
; employee, set their seated animation moving or still, and put a still one back on the loop's first
; frame (the pose facing the viewer); and, below, the environment pass's setters. Everything else
; stays refused. A change here takes effect when the game restarts.
; FunctionName is a TOptional: its value goes in parentheses. Written FunctionName="SetPlayRate" it
; fails to import, stays unset, and the entry then allows every function of the class.
bAllowAnyRemoteFunctionCall=False
+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/Engine.Actor",FunctionName=("SetActorHiddenInGame"),bAllowChildClasses=True)
+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/Engine.SkeletalMeshComponent",FunctionName=("SetPlayRate"),bAllowChildClasses=True)
+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/Engine.SkeletalMeshComponent",FunctionName=("SetPosition"),bAllowChildClasses=True)
; The environment pass (the real hour, 2026-09-19): the backend turns the sun to the real sun, sets
; the lamps, the sky light and the fog by the hour, picks the sky backdrop's cells, eases the haze
; and the road, and keeps the shelter clock's ClockOffsetS. Each call is matched on the object's own
; class, so child classes are allowed explicitly: the sun and the lamps are DirectionalLight, Point,
; Spot and Rect light components (children of LightComponent). The sky light is not a LightComponent
; (it derives from LightComponentBase), so it has its own lines.
+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/Engine.LightComponent",FunctionName=("SetIntensity"),bAllowChildClasses=True)
+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/Engine.LightComponent",FunctionName=("SetLightColor"),bAllowChildClasses=True)
; the sun's rotation (Movable since the rebuild: a Stationary light refuses any move in a game world)
+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/Engine.SceneComponent",FunctionName=("K2_SetWorldRotation"),bAllowChildClasses=True)
+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/Engine.SkyLightComponent",FunctionName=("SetIntensity"),bAllowChildClasses=True)
+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/Engine.SkyLightComponent",FunctionName=("SetLightColor"),bAllowChildClasses=True)
+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/Engine.SkyLightComponent",FunctionName=("SetLowerHemisphereColor"),bAllowChildClasses=True)
+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/Engine.ExponentialHeightFogComponent",FunctionName=("SetFogInscatteringColor"),bAllowChildClasses=True)
+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/Engine.ExponentialHeightFogComponent",FunctionName=("SetFogDensity"),bAllowChildClasses=True)
; material parameters by name on a whole mesh: the sky's PlateA/PlateB/PlateBlend/Mirror, the
; clock's ClockOffsetS, the windows' DayBlend, the haze, the road, and EmissiveFactor only on the
; meshes env_report.json flags as scaling uniformly
+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/Engine.MeshComponent",FunctionName=("SetScalarParameterValueOnMaterials"),bAllowChildClasses=True)
+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/Engine.MeshComponent",FunctionName=("SetVectorParameterValueOnMaterials"),bAllowChildClasses=True)
; The shelter clock's one read: the game time its material's Time node shows. The backend sends
; ClockOffsetS = local seconds of the day minus this time, so without it the face stays at --:--.
; A getter on a static library, child classes refused: this one function of this one class only.
+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/Engine.GameplayStatics",FunctionName=("GetTimeSeconds"),bAllowChildClasses=False)
